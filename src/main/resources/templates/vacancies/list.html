<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Vacantes - TalentBoard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .table-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="table-container">
        <h2 class="mb-4 text-primary">Vacantes Disponibles</h2>

        <table class="table table-hover table-striped">
            <thead class="table-primary">
            <tr>
                <th>Título</th>
                <th>Categoría</th>
                <th>Modalidad</th>
                <th>Salario</th>
            </tr>
            </thead>
            <tbody>
            <!-- Iteración sobre la lista de vacantes -->
            <tr th:each="vacant : ${vacancies}">
                <td class="fw-bold" th:text="${vacant.title}">Título</td>
                <td th:text="${vacant.category}">Categoría</td>
                <td>
                    <span class="badge bg-info text-dark" th:text="${vacant.modality}">Modalidad</span>
                </td>
                <td th:text="${'$' + #numbers.formatDecimal(vacant.salaryRange, 0, 'COMMA', 2, 'POINT')}">Salario</td>
            </tr>
            <!-- Mensaje si no hay vacantes -->
            <tr th:if="${vacancies.empty}">
                <td colspan="4" class="text-center text-muted">No hay vacantes disponibles en este momento.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
