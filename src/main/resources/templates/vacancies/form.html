<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Vacante - TalentBoard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .form-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="form-container">
                <h2 class="mb-4 text-primary text-center">Registrar Nueva Vacante</h2>

                <form th:action="@{/vacancies/save}" th:object="${vacancyDTO}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Título de la Vacante</label>
                        <input type="text" th:field="*{title}" class="form-control" placeholder="Ej: Desarrollador Java Senior" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Categoría</label>
                            <input type="text" th:field="*{category}" class="form-control" placeholder="Ej: IT, Recursos Humanos" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Modalidad</label>
                            <select th:field="*{modality}" class="form-select">
                                <option value="Presencial">Presencial</option>
                                <option value="Remoto">Remoto</option>
                                <option value="Híbrido">Híbrido</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Salario Estimado</label>
                        <input type="number" step="0.01" th:field="*{salaryRange}" class="form-control" placeholder="0.00" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Detalles del puesto..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">ID del Responsable</label>
                        <input type="number" th:field="*{responsibleId}" class="form-control" placeholder="Ingrese el ID del reclutador" required>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Guardar Vacante</button>
                        <a href="/vacancies" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
